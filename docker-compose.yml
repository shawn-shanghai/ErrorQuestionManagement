services:
  db:
    image: postgres:16-alpine
    container_name: examcenter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-examcenter}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-examcenter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-examcenter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examcenter-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-examcenter}:${DB_PASSWORD}@db:5432/${DB_NAME:-examcenter}
      SECRET_KEY: ${SECRET_KEY}
      UPLOAD_PATH: /data/uploads
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examcenter-frontend
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: examcenter-admin
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: examcenter-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/data/uploads:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
      - admin

volumes:
  postgres_data:
  uploads_data:
